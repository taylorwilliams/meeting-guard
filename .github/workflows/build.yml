name: macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build signed local app
        run: scripts/build-app.sh
      - name: Verify bundle
        run: '"dist/Meeting Guard.app/Contents/MacOS/MeetingGuard" --diagnostics'
  repository:
    name: Repository checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install audit tools
        run: brew install actionlint gitleaks
      - name: Validate workflows
        run: actionlint
      - name: Scan tracked source and history for secrets
        run: |
          gitleaks git --redact --no-banner
          gitleaks dir --redact --no-banner .
      - name: Check formatting and scripts
        run: |
          git diff --check
          bash -n scripts/build-app.sh scripts/verify-app.sh
          python3 -m unittest discover -s Tests/RepositoryTests -v

name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build signed local app
        run: scripts/build-app.sh
      - name: Verify bundle
        run: '"dist/Meeting Guard.app/Contents/MacOS/MeetingGuard" --diagnostics'
